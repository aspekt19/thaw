# D1 database_id for the deployed "thaw" database (not a secret). Do not put an account id or a secret here.
name = "thaw"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.traces]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/v1/*"]

[[d1_databases]]
binding = "DB"
database_name = "thaw"
database_id = "bb9bc9ab-a143-43b7-9456-821d1169d5b6"

[vars]
THAW_CHECK_PRICE_USD = "1.00"
THAW_PAYMENT_CHAIN = "base"
THAW_PAYMENT_CONFIRMATIONS = "1"
THAW_CASE_LIGHT_USD = "49"
THAW_CASE_FULL_USD = "79"
THAW_PAID_PATH_ENABLED = "0"
THAW_KITE_ENABLED = "0"
THAW_KITE_DAILY_CAP_USD = "10"
# Payment off until Kite, SERV and MCP are connected. Re-enable with:
# THAW_USDC_ADDRESS = "0x250aC40Ab38E4f023c33C1c3DFD0Cd07357Fbf79"
THAW_USDC_ADDRESS = ""
